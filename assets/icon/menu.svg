<?xml version="1.0" encoding="utf-8"?>
<!-- macOS 输入法菜单图标：品牌雪山的单峰剪影，一座尖主峰加山顶一枚 V 形雪线缺口。
     整块只作 alpha 用：TISIconIsTemplate 下系统按深浅色反色，菜单栏与系统设置的输入法
     列表里都是白色山形、缺口透明。峰形从应用图标 icon.png 的主峰简化而来，手改，
     不要从 icon.png 自动提轮廓。
     轮廓与缺口按 22x16 的实像素手调过：这个尺寸下细于 2px 的发丝、圆弧和贴基线的深洞
     只会糊成毛边或把底部切出细白腿，所以峰线一律取直、只留山顶一枚缺口，圆角一律不做。
     导出命令见 assets/icon/README.md。 -->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" x="0px" y="0px"
	 viewBox="0 0 39 28" style="enable-background:new 0 0 39 28;" xml:space="preserve">
<path fill-rule="evenodd" fill="#000000" d="M1.6,25.2 L12.0,10.0 L19.5,2.6 L27.0,10.0 L37.4,25.2 Z M16.8,9.0 L19.5,14.2 L22.2,9.0 Z"/>
</svg>
