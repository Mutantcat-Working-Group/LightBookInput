<?xml version="1.0" encoding="utf-8"?>
<!-- macOS 输入法菜单图标：品牌雪山剪影，左肩、尖主峰、右峰三座山，实心无镂空。
     整块只作 alpha 用：TISIconIsTemplate 下系统按深浅色反色，菜单栏与系统设置的输入法
     列表里都是白色山形。峰形从应用图标 icon.png 的雪山简化而来，手改，
     不要从 icon.png 自动提轮廓。
     轮廓按 22x16 的实像素手调过：这个尺寸下细于 2px 的发丝、圆弧和贴基线的深洞
     只会糊成毛边或把底部切出细白腿，所以峰线一律取直、不做任何镂空，圆角一律不做。
     导出命令见 assets/icon/README.md。 -->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" x="0px" y="0px"
	 viewBox="0 0 39 28" style="enable-background:new 0 0 39 28;" xml:space="preserve">
<path fill-rule="evenodd" fill="#000000" d="M1.6,25.2 L6.4,16.6 L9.6,13.4 L13.6,17.4 L19.0,3.4 L25.0,13.0 L28.4,16.6 L32.0,9.2 L37.4,25.2 Z"/>
</svg>
