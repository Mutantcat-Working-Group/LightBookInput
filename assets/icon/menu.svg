<?xml version="1.0" encoding="utf-8"?>
<!-- macOS 输入法菜单图标：与应用图标 icon.png 同形的品牌雪山剪影，右坡岩面与左肩棱线镂空。
     整块只作 alpha 用：TISIconIsTemplate 下系统按深浅色反色，菜单栏与系统设置的输入法
    列表里都是白色山形、棱线透明。由 icon.png 提取轮廓与岩区生成，改品牌图后重跑
     轮廓与镂空按 22x16 的实像素手调过：这个尺寸下细于 2px 的发丝、斜纹和贴基线的深洞
     只会糊成毛边或把底部切出细白腿，所以刻意只留两处干净镂空，不从 icon.png 自动提轮廓。
     导出命令见 assets/icon/README.md。 -->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" x="0px" y="0px"
	 viewBox="0 0 39 28" style="enable-background:new 0 0 39 28;" xml:space="preserve">
<path fill-rule="evenodd" fill="#000000" d="M1.4,23.2 L8.4,12.6 L12.4,10.9 L16.8,11.7 L19.6,4.4 L23.6,6.1 L27.1,11.1 L29.9,11.3 L37.6,23.2 Z M21.9,7 Q25.4,9 25.6,12 Q25.6,15.8 22.6,17.6 Q21,16.6 21.2,13 Q21.3,9.4 21.9,7 Z M6.6,13.8 L10.8,17.6 L5.6,18.4 Z"/>
</svg>
